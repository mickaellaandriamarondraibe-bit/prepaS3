<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 18px Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 16px Arial, sans-serif; fill: #334155; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .step { font: 700 17px Arial, sans-serif; fill: #ffffff; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .view { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .controller { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .service { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .repo { fill: #fae8ff; stroke: #9333ea; stroke-width: 2; }
      .db { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .badge { fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>

  <text x="600" y="55" text-anchor="middle" class="title">Workflow MVC - Inscription utilisateur</text>
  <text x="600" y="86" text-anchor="middle" class="subtitle">Exemple simple avec FlightPHP, validation serveur, AJAX et base de donnees</text>

  <!-- Row 1 -->
  <rect x="70" y="135" width="260" height="130" rx="8" class="view"/>
  <circle cx="105" cy="165" r="18" class="badge"/>
  <text x="105" y="171" text-anchor="middle" class="step">1</text>
  <text x="135" y="166" class="box-title">Navigateur</text>
  <text x="95" y="205" class="box-text">L'utilisateur ouvre :</text>
  <text x="95" y="230" class="small">GET /register</text>

  <rect x="470" y="135" width="260" height="130" rx="8" class="controller"/>
  <circle cx="505" cy="165" r="18" class="badge"/>
  <text x="505" y="171" text-anchor="middle" class="step">2</text>
  <text x="535" y="166" class="box-title">Route</text>
  <text x="495" y="205" class="box-text">app/routes.php</text>
  <text x="495" y="230" class="small">choisit le controller</text>

  <rect x="870" y="135" width="260" height="130" rx="8" class="controller"/>
  <circle cx="905" cy="165" r="18" class="badge"/>
  <text x="905" y="171" text-anchor="middle" class="step">3</text>
  <text x="935" y="166" class="box-title">Controller</text>
  <text x="895" y="205" class="box-text">AuthController</text>
  <text x="895" y="230" class="small">affiche la vue register</text>

  <path d="M330 200 L470 200" class="arrow"/>
  <path d="M730 200 L870 200" class="arrow"/>

  <!-- Row 2 -->
  <rect x="470" y="330" width="260" height="130" rx="8" class="view"/>
  <circle cx="505" cy="360" r="18" class="badge"/>
  <text x="505" y="366" text-anchor="middle" class="step">4</text>
  <text x="535" y="361" class="box-title">Vue</text>
  <text x="495" y="400" class="box-text">register.php</text>
  <text x="495" y="425" class="small">affiche le formulaire HTML</text>

  <path d="M1000 265 C1000 310 730 300 650 330" class="arrow"/>

  <!-- Row 3 -->
  <rect x="70" y="525" width="260" height="145" rx="8" class="view"/>
  <circle cx="105" cy="555" r="18" class="badge"/>
  <text x="105" y="561" text-anchor="middle" class="step">5</text>
  <text x="135" y="556" class="box-title">Formulaire</text>
  <text x="95" y="595" class="box-text">L'utilisateur remplit :</text>
  <text x="95" y="620" class="small">nom, prenom, email,</text>
  <text x="95" y="642" class="small">mot de passe, telephone</text>

  <rect x="470" y="525" width="260" height="145" rx="8" class="service"/>
  <circle cx="505" cy="555" r="18" class="badge"/>
  <text x="505" y="561" text-anchor="middle" class="step">6</text>
  <text x="535" y="556" class="box-title">Validation</text>
  <text x="495" y="595" class="box-text">Validator.php</text>
  <text x="495" y="620" class="small">verifie les champs</text>
  <text x="495" y="642" class="small">renvoie erreurs ou OK</text>

  <rect x="870" y="525" width="260" height="145" rx="8" class="repo"/>
  <circle cx="905" cy="555" r="18" class="badge"/>
  <text x="905" y="561" text-anchor="middle" class="step">7</text>
  <text x="935" y="556" class="box-title">Repository</text>
  <text x="895" y="595" class="box-text">UserRepository.php</text>
  <text x="895" y="620" class="small">prepare les requetes SQL</text>
  <text x="895" y="642" class="small">insert l'utilisateur</text>

  <path d="M600 460 C580 500 290 485 230 525" class="arrow"/>
  <path d="M330 598 L470 598" class="arrow"/>
  <path d="M730 598 L870 598" class="arrow"/>

  <!-- Database -->
  <rect x="470" y="720" width="260" height="70" rx="8" class="db"/>
  <text x="600" y="750" text-anchor="middle" class="box-title">Base de donnees</text>
  <text x="600" y="775" text-anchor="middle" class="small">table users dans database/schema.sql</text>

  <path d="M1000 670 C1000 750 760 755 730 755" class="arrow"/>

  <!-- Ajax note -->
  <rect x="70" y="330" width="260" height="130" rx="8" class="soft"/>
  <text x="95" y="365" class="box-title">AJAX</text>
  <text x="95" y="400" class="box-text">validation-ajax.js</text>
  <text x="95" y="425" class="small">demande une verification</text>
  <text x="95" y="447" class="small">sans recharger la page</text>

  <path d="M470 395 L330 395" class="arrow"/>
  <path d="M330 430 C400 500 470 500 520 525" class="arrow"/>
</svg>
