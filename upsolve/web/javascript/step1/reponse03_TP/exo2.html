<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document go</title>
</head>
<body>
<div id="st"></div>
</body>
<script>
let nom= prompt("Entrer votre nom:");
document.title=nom;
let titre=document.createElement("h1");
    titre.textContent="Bienvenue";
    document.getElementById("st").appendChild(titre).append(nom);
</script>
</html>
